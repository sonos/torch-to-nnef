[project]
name = "torch_to_nnef"
version = "0.24.5"
description = "Any PyTorch Model to NNEF file format."
authors = [{ name = "Julien Balian", email = "julien.balian@sonos.com" }]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE"]

requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "nnef",
    "pytorch",
    "torch",
    "deep learning",
    "machine learning",
    "ai",
    "llm",
    "transformers",
    "export",
    "exchange format",
]
dependencies = [
    "mako>=1.0.0,<2.0",
    "nnef>=1.0.7,<2",
    "nnef_tools>=1.0.7,<2",
    "numpy>=1.26.0,<3",
    "pyyaml>=5.0",
    "torch>=1.8.0,<3",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
# Backward-compat redirect extras (install the split packages)
llm-tract = ["torch_to_nnef_llm"]
llm-tract-accelerate = ["torch_to_nnef_llm[accelerate]"]
peft = ["torch_to_nnef_llm[peft]"]
nemo-tract = ["torch_to_nnef_nemo_asr"]
safetensors = ["safetensors"]
# Intuitive aliases matching the split package / directory names
llm = ["torch_to_nnef_llm"]
nemo-asr = ["torch_to_nnef_nemo_asr"]
[project.urls]
Homepage = "https://github.com/sonos/torch-to-nnef"

[project.entry-points."pygments.lexers"]
nnef = "docs.nnef_lexer:NNEFLexer"

[dependency-groups]
test = [
    "mypy>=1.13,<3.0",
    "pytest-cov>=6.0.0,<8",
    "pytest>=9.0.3,<10",
    "hypothesis>=6.100,<7",
    "ruff<1.0",
    "safetensors",
    "coverage[toml]",
    "prospector",
]
dev = [
    "bump2version>=1.0.1,<2",
    "ipdb>=0.13.9,<0.14",
    "mike>=2.1.3",
    "mkdocs-api-autonav==0.4.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material>=9.6,<9.8",
    "mkdocs<1.7,>=1.6",
    "mkdocstrings-python>=1.11,<2.1",
    "pip>=26.1",
    "pre-commit>=2.12.0,<5",
    "rich>=13.7.1,<16",
    "toml>=0.10.2,<0.11",
    "tox>=4.23.2,<5",
    "twine>=3.3.0,<7",
    "virtualenv>=20.36.1,<22",
]

[tool.uv]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
torch_to_nnef_llm = { workspace = true }
torch_to_nnef_nemo_asr = { workspace = true }

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple/"

[tool.hatch.build.targets.sdist]
include = ["torch_to_nnef", "CHANGELOG.md"]
exclude = ["packages"]

[tool.hatch.build.targets.wheel]
include = ["torch_to_nnef", "CHANGELOG.md"]
exclude = ["packages"]

[build-system]
# be sure to install pip >= 23.2 to avoid build issues
requires = ["setuptools>=83.0.0", "hatchling>=1.20", "packaging>=24.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = 'py310'

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
    # docstring
    "D",
]
ignore = [
    # if a docstring then ensure consistency but if it is missing do not raise issue {
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    # }
]


[tool.ruff.lint.isort]
known-first-party = ["torch_to_nnef", "torch_to_nnef_llm", "torch_to_nnef_nemo"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:warnings -s"
markers = [
    "ci_skip: marks tests as slow (deselect with '-m \"not ci_skip\"')",
    "serial",
    "proptest: hypothesis-driven property-based tests (run with '-m proptest')",
    "proptest_onnx: ONNX-export support measurement sweep (run with '-m proptest_onnx')",
]

## Note: isort-style configuration like `known-first-party` must live under
## `tool.ruff.lint.isort` (already configured above). It is not a valid pylint
## option and caused Prospector/Pylint to error with E0015 (unrecognized option).

[tool.pylint.master]
py-version = "3.10"
extension-pkg-allow-list = ["torch", "numpy", "peft"]

[tool.pylint.typecheck]
ignored-modules = ["torch", "numpy"]
ignored-classes = ["torch", "numpy"]
generated-members = ["torch.*", "peft.*"]

[tool.pylint.format]
max-module-lines = 2600


[tool.pylint."MESSAGE CONTROL"]
disable = [
    "deprecated-module",
    "invalid-name",
    "len-as-condition",
    "line-too-long",
    "locally-disabled",
    "logging-fstring-interpolation",
    "not-callable",
    "protected-access",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "unused-argument",
    "unused-wildcard-import",
    "wrong-import-position",
    "wrong-import-order",            # ruff/isort handles this with correct first-party config
    "import-error",                  # prospector have trouble with nnef, nnef_tools
    "cyclic-import",                 # false trigger in prospector
]

[tool.pylint.DESIGN]
max-attributes = 15

[tool.mypy]
# Matches the supported range in `classifiers` and the CI matrix (3.10 to
# 3.14). It was 3.9, which made mypy reject the `zip(..., strict=True)` and
# `X | Y` syntax already used throughout the codebase.
python_version = "3.10"
ignore_missing_imports = true
# Same surface the pre-commit hook excludes, so `make lint` and the hook
# agree on what is checked. examples/ holds standalone scripts whose
# same-named siblings in hyphenated directories cannot yield distinct
# module paths, which made mypy abort instead of checking anything.
exclude = "(^examples/|tests/)"


[[tool.mypy.overrides]]
module = "torch"
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.tox]
isolated_build = true
envlist = ["py313", "py314", "format", "lint", "build"]
requires = ["tox>=4", "virtualenv>20.2", "tox-uv>1.27.0"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main",
]

# -- shared base for all envs ------------------------------------------------

[tool.tox.env_run_base]
dependency_groups = ["test"]
passenv = ["*"]
constrain_package_deps = true

[[tool.tox.env_run_base.setenv]]
PYTHONPATH = "{toxinidir}"
PYTHONWARNINGS = "ignore"
MODELS = "1"

# -- core envs (lightweight, no torchvision/torchaudio/librosa) ---------------

[tool.tox.env.py313]
basepython = ["python3.13"]
deps = ["--index-url=https://download.pytorch.org/whl/cpu", "torch==2.6.*"]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "--cov=torch_to_nnef",
        "--cov-branch",
        "--cov-report=xml",
        "--cov-report=term-missing",
        "--ignore=tests/test_model_zoo.py",
        "--ignore=tests/test_dynamic_axes.py",
        "--ignore=tests/test_fft.py",
        "--ignore=tests/test_mod.py",
        "--ignore=tests/test_primitive_proptest.py",
        "--ignore=tests/test_primitive_proptest_onnx.py",
        "--ignore=tests/test_proptest_aten_attribution.py",
        "tests",
    ],
    [
        "pytest",
        "--doctest-modules",
        "torch_to_nnef",
    ],
]

[tool.tox.env.torch_1_13]
basepython = ["python3.10"]
deps = ["torch==1.13.1", "safetensors<=0.4.2", "numpy<2.0.0"]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "--ignore=tests/test_model_zoo.py",
        "--ignore=tests/test_dynamic_axes.py",
        "--ignore=tests/test_fft.py",
        "--ignore=tests/test_mod.py",
        "--ignore=tests/test_primitive_proptest.py",
        "--ignore=tests/test_primitive_proptest_onnx.py",
        "--ignore=tests/test_proptest_aten_attribution.py",
        "tests",
    ],
    [
        "pytest",
        "--doctest-modules",
        "torch_to_nnef",
    ],
]

[tool.tox.env.py314]
basepython = ["python3.14"]
deps = ["torch==2.11.*"]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "--cov=torch_to_nnef",
        "--cov-branch",
        "--cov-report=xml",
        "--cov-report=term-missing",
        "--ignore=tests/test_model_zoo.py",
        "--ignore=tests/test_dynamic_axes.py",
        "--ignore=tests/test_fft.py",
        "--ignore=tests/test_mod.py",
        "--ignore=tests/test_primitive_proptest.py",
        "--ignore=tests/test_primitive_proptest_onnx.py",
        "--ignore=tests/test_proptest_aten_attribution.py",
        "tests",
    ],
    [
        "pytest",
        "--doctest-modules",
        "torch_to_nnef",
    ],
]

[tool.tox.env.torch_2_2]
basepython = ["python3.12"]
deps = ["torch==2.2.2", "numpy<2.0.0", "safetensors<=0.4.2"]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "--ignore=tests/test_model_zoo.py",
        "--ignore=tests/test_dynamic_axes.py",
        "--ignore=tests/test_fft.py",
        "--ignore=tests/test_mod.py",
        "--ignore=tests/test_primitive_proptest.py",
        "--ignore=tests/test_primitive_proptest_onnx.py",
        "--ignore=tests/test_proptest_aten_attribution.py",
        "tests",
    ],
    [
        "pytest",
        "--doctest-modules",
        "torch_to_nnef",
    ],
