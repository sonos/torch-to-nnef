# -- proptest envs (hypothesis-driven primitive sweeps) ----------------------
# proptest:        ci profile (25 examples, derandomized), runs on every PR
# proptest_nightly: nightly profile (200 examples), run on demand / scheduled
[tool.tox.env.proptest]
basepython = ["python3.13"]
deps = ["--index-url=https://download.pytorch.org/whl/cpu", "torch==2.6.*"]
set_env = { T2N_HYP_PROFILE = "ci" }
commands = [
    [
        "pytest",
        "-m",
        "proptest",
        "-v",
        "--hypothesis-show-statistics",
        "tests/test_primitive_proptest.py",
    ],
]

[tool.tox.env.silero_vad_demo]
# End-to-end check that examples/vad/silero-jit/export.py runs successfully.
# Pinned to torch 2.11 because `harden_jit_for_export` calls
# `torch._C._jit_interpret_graph`, an undocumented internal API whose
# behavior is only guaranteed on the version we test against.
basepython = ["python3.13"]
deps = [
    "--index-url=https://download.pytorch.org/whl/cpu",
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "silero-vad",
]
commands = [
    [
        "python",
        "examples/vad/silero-jit/export.py",
    ],
]

[tool.tox.env.proptest_nightly]
basepython = ["python3.13"]
deps = ["--index-url=https://download.pytorch.org/whl/cpu", "torch==2.6.*"]
set_env = { T2N_HYP_PROFILE = "nightly" }
commands = [
    [
        "pytest",
        "-m",
        "proptest",
        "-v",
        "--hypothesis-show-statistics",
        "tests/test_primitive_proptest.py",
    ],
]

# -- ONNX support measurement (feeds the support page) ----------------------
# Measures what `torch.onnx.export(dynamo=True)` does with every proptest
# spec and writes the graded artifact the support page reads. On-demand,
# like proptest_nightly: an ONNX gap is not a t2n regression, so this must
# never be able to turn a contributor's PR red, and it is not in the
# ci-core matrix.
#
# Torch is pinned newer than the 2.6 the `proptest` envs use, because the
# TorchScript ONNX exporter was removed in 2.9 and `dynamo=True` is the
# only remaining path. Those envs must stay on 2.6.
#
# The `ci` hypothesis profile is deliberate here, not a cost compromise:
# it derandomizes, so the committed artifact is reproducible and a grade
# change shows up in review as a real change rather than as draw noise.
# For a deeper sweep, override with T2N_HYP_PROFILE=nightly (200 examples,
# random draws, several hours).
#
# Refresh flow: run this env, then regenerate the page (see
# docs/contributing/onnx_support_page.md).
[tool.tox.env.proptest_onnx]
basepython = ["python3.13"]
deps = [
    "--index-url=https://download.pytorch.org/whl/cpu",
    "torch==2.13.*",
    "onnx",
    "onnxruntime",
    # Required by the dynamo ONNX exporter; deliberately not in the `test`
    # dependency group so the fast suite gains no dependency.
    "onnxscript",
]
set_env = { T2N_HYP_PROFILE = "ci" }
commands = [
    [
        "pytest",
        "-m",
        "proptest_onnx",
        "-v",
        "--onnx-report=docs/contributing/onnx_support_measured.json",
        "tests/test_proptest_aten_attribution.py",
        "tests/test_primitive_proptest_onnx.py",
    ],
]

[tool.tox.env.format]
skip_install = true
deps = ["ruff"]
commands = [
    [
        "ruff",
        "format",
        "torch_to_nnef",
        "tests",
        "packages",
        "examples",
    ],
    [
        "ruff",
        "check",
        "--fix",
        "torch_to_nnef",
        "tests",
        "packages",
        "examples",
    ],
]

[tool.tox.env.format_check]
skip_install = true
deps = ["ruff"]
commands = [
    [
        "ruff",
        "format",
        "--check",
        "torch_to_nnef",
        "tests",
        "packages",
        "examples",
    ],
    [
        "ruff",
        "check",
        "torch_to_nnef",
        "tests",
        "packages",
        "examples",
    ],
]

[tool.tox.env.lint]
skip_install = true
deps = ["ruff"]
commands = [
    ["ruff", "check", "-q", "torch_to_nnef", "tests", "packages", "examples"],
]

[tool.tox.env.static_check]
deps = ["prospector[with_dodgy]", "pyroma"]
commands = [
    ["prospector", "--no-autodetect", "-X"],
    [
        "pyroma",
        ".",
        "-n",
        # minimum score:
        "8",
    ],
]

[tool.tox.env.build]
allowlist_externals = ["uv"]
extras = ["dev"]
commands = [["uv", "build"]]
