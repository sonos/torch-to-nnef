deps = [
    "--index-url=https://download.pytorch.org/whl/cpu",
    "torch==2.6.*",
    "torchvision==0.21.*",
    "torchaudio==2.6.*",
    "librosa==0.11.0",
]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "tests/test_model_zoo.py",
        "tests/test_dynamic_axes.py",
        "tests/test_fft.py",
        "tests/test_mod.py",
    ],
]

[tool.tox.env.zoo_py314]
basepython = ["python3.14"]
deps = [
    "torch==2.11.*",
    "torchvision==0.26.*",
    "torchaudio==2.11.*",
    "librosa==0.11.0",
]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "tests/test_model_zoo.py",
        "tests/test_dynamic_axes.py",
        "tests/test_fft.py",
        "tests/test_mod.py",
    ],
]

[tool.tox.env.zoo_torch_2_2]
basepython = ["python3.12"]
deps = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchaudio==2.2.2",
    "numpy<2.0.0",
    "safetensors<=0.4.2",
    "librosa==0.11.0",
]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
