[project]
name = "torch_to_nnef"
version = "0.22.0"
description = "Any PyTorch Model to NNEF file format."
authors = [{ name = "Julien Balian", email = "julien.balian@sonos.com" }]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE"]

requires-python = ">=3.9"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "nnef",
    "pytorch",
    "torch",
    "deep learning",
    "machine learning",
    "ai",
    "llm",
    "transformers",
    "export",
    "exchange format",
]
dependencies = [
    "mako>=1.0.0,<2.0",
    "nnef>=1.0.7,<2",
    "nnef_tools>=1.0.7,<2",
    "numpy>=1.26.0,<3",
    "pyyaml>=5.0",
    "torch>=1.8.0,<3",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
# Backward-compat redirect extras (install the split packages)
llm-tract = ["torch_to_nnef_llm"]
llm-tract-accelerate = ["torch_to_nnef_llm[accelerate]"]
peft = ["torch_to_nnef_llm[peft]"]
nemo-tract = ["torch_to_nnef_nemo_asr"]
safetensors = ["safetensors"]
test = [
    "mypy~=1.13",
    "pytest-cov>=6.0.0,<7",
    "pytest>=8.3.3,<9",
    "ruff<1.0",
    "safetensors",
    "torchaudio>=0.9.0,<3",
    "torchvision>=0.10.0,<0.25",
    "librosa==0.11.0",
    "coverage[toml]",
    "prospector",
]
[project.urls]
Homepage = "https://github.com/sonos/torch-to-nnef"

[project.entry-points."pygments.lexers"]
nnef = "docs.nnef_lexer:NNEFLexer"

[dependency-groups]
dev = [
    "bump2version>=1.0.1,<2",
    "ipdb>=0.13.9,<0.14",
    "mike>=2.1.3",
    "mkdocs-api-autonav==0.3.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material<9.7,>=9.6",
    "mkdocs<1.7,>=1.6",
    "mkdocstrings-python<1.12,>=1.11",
    "pip~=24.0",
    "pre-commit>=2.12.0,<3",
    "rich>=13.7.1,<14",
    "toml>=0.10.2,<0.11",
    "tox>=4.23.2,<5",
    "twine>=3.3.0,<4",
    "virtualenv>=20.2.2,<21",
]

[tool.uv]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
torch_to_nnef_llm = { workspace = true }
torch_to_nnef_nemo_asr = { workspace = true }

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple/"

[tool.hatch.build.targets.sdist]
include = ["torch_to_nnef", "CHANGELOG.md"]
exclude = ["packages"]

[tool.hatch.build.targets.wheel]
include = ["torch_to_nnef", "CHANGELOG.md"]
exclude = ["packages"]

[build-system]
# be sure to install pip >= 23.2 to avoid build issues
requires = ["setuptools>42", "hatchling>=1.20", "packaging>=24.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = 'py39'

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
    # docstring
    "D",
]
ignore = [
    # if a docstring then ensure consistency but if it is missing do not raise issue {
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    # }
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:warnings -s"
markers = [
    "ci_skip: marks tests as slow (deselect with '-m \"not ci_skip\"')",
    "serial",
]

[tool.isort]
known_first_party = ["torch_to_nnef", "torch_to_nnef_llm", "torch_to_nnef_nemo"]

[tool.pylint.master]
py-version = "3.10"
extension-pkg-allow-list = ["torch", "numpy", "peft"]

[tool.pylint.typecheck]
ignored-modules = ["torch", "numpy"]
ignored-classes = ["torch", "numpy"]
generated-members = ["torch.*", "peft.*"]

[tool.pylint.format]
max-module-lines = 2000


[tool.pylint."MESSAGE CONTROL"]
disable = [
    "deprecated-module",
    "invalid-name",
    "len-as-condition",
    "line-too-long",
    "locally-disabled",
    "logging-fstring-interpolation",
    "not-callable",
    "protected-access",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "unused-argument",
    "unused-wildcard-import",
    "wrong-import-position",
    "import-error",                  # prospector have trouble with nnef, nnef_tools
    "cyclic-import",                 # false trigger in prospector
]

[tool.pylint.DESIGN]
max-attributes = 15

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "torch"
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.tox]
isolated_build = true
envlist = ["py39", "py313", "format", "lint", "build"]
requires = ["tox>=4", "virtualenv>20.2", "tox-uv>1.27.0"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main",
]

[tool.tox.env_run_base]
extras = ["test"]
passenv = ["*"]
constrain_package_deps = true
deps = ["torchvision==0.22.1", "torchaudio==2.7.*"]
commands = [
    [
        "pytest",
        "-m",
        "not ci_skip",
        "-x",
        "--cov=torch_to_nnef",
        "--cov-branch",
        "--cov-report=xml",
        "--cov-report=term-missing",
        "tests",
    ],
    [
        "pytest",
        "--doctest-modules",
        "torch_to_nnef",
    ],
]

[tool.tox.env.py313]
basepython = ["python3.13"]
extras = ["test"]
deps = [
    "--index-url=https://download.pytorch.org/whl/cpu",
    "torch==2.6.*",
    "torchvision==0.21.*",
    "torchaudio==2.6.*",
]

[tool.tox.env.torch_1_10]
basepython = ["python3.9"]
extras = ["test"]
deps = [
    "torch==1.10.1",
    "torchvision==0.11.2",
    "torchaudio==0.10.1",
    "safetensors<=0.4.2",
    "numpy<2.0.0",
    "setuptools<70",
]

[tool.tox.env.torch_1_13]
basepython = ["python3.9"]
extras = ["test"]
deps = [
    "torch==1.13.1",
    "torchvision==0.14.1",
    "torchaudio==0.13.1",
    "safetensors<=0.4.2",
    "numpy<2.0.0",
]


[tool.tox.env.torch_2_2]
basepython = ["python3.12"]
extras = ["test"]
deps = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchaudio==2.2.2",
    "numpy<2.0.0",
    "safetensors<=0.4.2",
]

[[tool.tox.env_run_base.setenv]]
PYTHONPATH = "{toxinidir}"
PYTHONWARNINGS = "ignore"
MODELS = "1"


[tool.tox.env.format]
skip_install = true
deps = ["ruff"]
commands = [
    [
        "ruff",
        "format",
        "torch_to_nnef",
        "tests",
        "packages",
    ],
    [
        "ruff",
        "check",
        "--fix",
        "torch_to_nnef",
        "tests",
        "packages",
    ],
]

[tool.tox.env.format_check]
skip_install = true
deps = ["ruff"]
commands = [
    [
        "ruff",
        "format",
        "--check",
        "torch_to_nnef",
        "tests",
        "packages",
    ],
    [
        "ruff",
        "check",
        "torch_to_nnef",
        "tests",
        "packages",
    ],
]

[tool.tox.env.lint]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", "-q", "torch_to_nnef", "tests", "packages"]]

[tool.tox.env.static_check]
deps = ["prospector[with_dodgy]", "pyroma"]
commands = [
    ["prospector", "--no-autodetect", "-X"],
    [
        "pyroma",
        ".",
        "-n",
        # minimum score:
        "8",
    ],
]

[tool.tox.env.build]
allowlist_externals = ["uv"]
extras = ["dev"]
commands = [["uv", "build"]]
