name: LLM CI

on:
  push:
    branches: [main]
    paths:
      - "packages/llm/**"
      - "examples/inkling2/**"
      - "tests/test_selected_experts.py"
      - "tests/test_symbolic_window_ops.py"
      - "torch_to_nnef/**"
      - "uv.lock"
      - ".github/workflows/ci-llm.yml"
      - "scripts/hf_pull.py"
  pull_request:
    branches: [main]
    paths:
      - "packages/llm/**"
      - "examples/inkling2/**"
      - "tests/test_selected_experts.py"
      - "tests/test_symbolic_window_ops.py"
      - "torch_to_nnef/**"
      - "uv.lock"
      - ".github/workflows/ci-llm.yml"
      - "scripts/hf_pull.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inkling:
    name: Inkling streaming export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned Inkling dependencies
        run: |
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -e packages/llm 'pytest>=8,<10' \
            'transformers @ git+https://github.com/huggingface/transformers.git@d8f10a82213a3a9db48385aba3a4b57ab535de50'
      - name: Require Inkling support and tract runtime
        run: |
          python - <<'PY'
          import os
          from transformers import Inkling2LoopForCausalLM
          from torch_to_nnef.inference_target.tract import TractCli
          from torch_to_nnef.utils import SemanticVersion
          cli = TractCli.download(SemanticVersion.from_str("0.23.10"))
          assert cli.version == "0.23.10"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TRACT_BIN={cli.tract_path}\n")
          PY
      - name: Check generic expert and symbolic-window operations
        run: python -m pytest tests/test_selected_experts.py tests/test_symbolic_window_ops.py -q
      - name: Check Inkling upstream parity and streaming NNEF execution
        working-directory: packages/llm
        run: python -m pytest tests/test_inkling2_handler.py -q
      - name: Run the documented float32 and Q4_0 examples
        run: |
          python examples/inkling2/export.py --tract "$TRACT_BIN" --out /tmp/inkling-f32
          python examples/inkling2/export.py --tract "$TRACT_BIN" --out /tmp/inkling-q4 --q4

  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create matrix
        id: create_matrix
        uses: fabiocaccamo/create-matrix-action@842c9dabf1cec0ba7417f30ec26ce2290b951ef0 # v7
        with:
          matrix: |
            python-version {3.12}, tox-env {"cli_transformers_4_50_0", "cli_transformers_4_52_0"}
            python-version {3.13}, tox-env {"cli_transformers_5_0_0", "cli_transformers_5_5_0"}

    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.prepare.outputs.matrix)}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.23.2

      # Reuse downloaded HF models across runs so most runs need no network at
      # all; key on the prefetch list + slug definitions so it busts when the
      # set of models changes. Model blobs are python-agnostic, so the matrix
      # jobs share one entry.
      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-llm-${{ hashFiles('packages/llm/tests/prefetch_hf_models.py', 'packages/llm/torch_to_nnef_llm/config.py') }}
          restore-keys: |
            hf-llm-

      # Warm the cache with retries before pytest: the suite downloads several
      # tiny models at collection time, which intermittently hits HF's per-IP
      # 429 on shared runners. Best-effort, so it never fails the build.
      - name: Prefetch HF models (retry on 429)
        run: |
          python -m pip install "huggingface_hub>=0.23"
          python packages/llm/tests/prefetch_hf_models.py

      - name: test with tox
        run: cd packages/llm && tox run -e ${{ matrix.tox-env }}
