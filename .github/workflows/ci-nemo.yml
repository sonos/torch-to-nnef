name: NeMo CI

on:
  push:
    branches: [main]
    paths:
      - "packages/nemo-asr/**"
      - "torch_to_nnef/**"
      - "uv.lock"
      - ".github/workflows/ci-nemo.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nemo-asr/**"
      - "torch_to_nnef/**"
      - "uv.lock"
      - ".github/workflows/ci-nemo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create matrix
        id: create_matrix
        uses: fabiocaccamo/create-matrix-action@842c9dabf1cec0ba7417f30ec26ce2290b951ef0 # v7
        with:
          matrix: |
            python-version {3.12}, tox-env {"nemo_tract_2_5_3"}
            python-version {3.13}, tox-env {"nemo_tract_2_7_2"}

    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.prepare.outputs.matrix)}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.23.2

      - name: test with tox
        run: cd packages/nemo-asr && tox run -e ${{ matrix.tox-env }}
