name: Deploy T2N docs

# Controls when the action will run.
on:
  push:
    # Deploy docs only on a tagged version release, not on every merge to main,
    # so the published docs track the latest packaged release (see release.yml,
    # which builds/publishes on the same `v*` tags).
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # `mike deploy --push` (below) pushes to gh-pages using this
          # credential, so it must persist (see .github/zizmor.yml).
          persist-credentials: true

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email sonos+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        # No caching: this workflow now runs on `v*` tags (a publishing trigger),
        # where a restored cache could be poisoned from a lower-privilege run
        # (zizmor cache-poisoning). release.yml follows the same no-cache pattern.

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Deploy to GitHub Pages
        run: |
          TAG=$(git describe --tags --abbrev=0)
          # Ensure tag starts with "v"
          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' does not start with 'v', skipping deploy."
            exit 0
          fi
          STRIPPED_VERSION=$(echo $TAG | sed 's/\.[0-9][0-9]*$//')
          uv run mike deploy --push --update-aliases "$STRIPPED_VERSION" latest
