name: Deploy T2N docs

# Controls when the action will run.
on:
  push:
    branches: [main]
    # Mirror doc-check.yml's PR trigger so a doc-only merge to main always
    # redeploys. The "10. Nemo ASR" tutorial is a symlink into examples/, so
    # an examples/ change can also change a doc page.
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "docs/**"
      - "examples/**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email sonos+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true


      - name: Install dependencies
        run: |
          uv sync --group dev

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Deploy to GitHub Pages
        run: |
          TAG=$(git describe --tags --abbrev=0)
          # Ensure tag starts with "v"
          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' does not start with 'v', skipping deploy."
            exit 0
          fi
          STRIPPED_VERSION=$(echo $TAG | sed 's/\.[0-9][0-9]*$//')
          uv run mike deploy --push --update-aliases "$STRIPPED_VERSION" latest
