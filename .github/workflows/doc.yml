name: Deploy T2N docs

# Controls when the action will run.
on:
  push:
    # Deploy docs only on a tagged version release, not on every merge to main,
    # so the published docs track the latest packaged release (see release.yml,
    # which builds/publishes on the same `v*` tags).
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `mike deploy --push` (below) pushes to gh-pages using this
          # credential, so it must persist (see .github/zizmor.yml).
          persist-credentials: true

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email sonos+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # No caching: this workflow now runs on `v*` tags (a publishing
          # trigger), where a restored cache could be poisoned from a
          # lower-privilege run (zizmor cache-poisoning). release.yml follows
          # the same no-cache pattern.
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Deploy to GitHub Pages
        run: |
          TAG=$(git describe --tags --abbrev=0)
          # Ensure tag starts with "v"
          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' does not start with 'v', skipping deploy."
            exit 0
          fi
          STRIPPED_VERSION=$(echo $TAG | sed 's/\.[0-9][0-9]*$//')
          uv run mike deploy --push --update-aliases "$STRIPPED_VERSION" latest
