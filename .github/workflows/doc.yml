name: Deploy T2N docs

# Controls when the action will run.
on:
  push:
    branches: [main]
    # Mirror doc-check.yml's PR trigger so a doc-only merge to main always
    # redeploys. The "10. Nemo ASR" tutorial is a symlink into examples/, so
    # an examples/ change can also change a doc page.
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "docs/**"
      - "examples/**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email sonos+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true


      - name: Install dependencies
        run: |
          uv sync --group dev

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Deploy to GitHub Pages
        run: |
          TAG=$(git describe --tags --abbrev=0)
          # Ensure tag starts with "v"
          if [[ "$TAG" != v* ]]; then
            echo "Tag '$TAG' does not start with 'v', skipping deploy."
            exit 0
          fi
          STRIPPED_VERSION=$(echo $TAG | sed 's/\.[0-9][0-9]*$//')
          uv run mike deploy --push --update-aliases "$STRIPPED_VERSION" latest
