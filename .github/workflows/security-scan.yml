name: security scan

# Trivy CVE gate + SPDX SBOM for the project's Python dependencies.
#
# - Gate: scans the installable runtime surfaces and fails on fixed advisories
#   (--ignore-unfixed), so a red build is always actionable (a bump exists):
#     * core (`pip install torch_to_nnef`) and the `llm` extra: HIGH + CRITICAL.
#     * the `nemo-asr` extra: CRITICAL only. Its 200+ pkg tree is largely pinned
#       transitively by nemo_toolkit, so HIGH findings there are frequently
#       unbumpable; gating it on CRITICAL keeps the signal actionable.
#   Dev, docs and test tooling are intentionally out of the gate; they are
#   captured in the SBOM instead of blocking every PR on tooling CVEs.
# - SBOM: emits a comprehensive SPDX document of the full locked workspace and
#   uploads it as a build artifact.
#
# Runs on dependency changes and weekly: Trivy's advisory DB updates through the
# day, so the scheduled run catches newly disclosed CVEs in deps that have not
# otherwise changed. Acknowledged/unfixable findings go in `.trivyignore` (read
# automatically) with a rationale, the same audit-trail pattern as cargo-deny.
on:
  # Runs on every PR (no path filter) so the CVE gate can be a required status
  # check without freezing PRs that don't touch dependency files.
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: trivy CVE gate + SPDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Trivy
        run: |
          set -euo pipefail
          VERSION=0.71.0
          base="https://github.com/aquasecurity/trivy/releases/download"
          curl -fsSL "${base}/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C /usr/local/bin trivy
          trivy --version | head -1
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-
      - name: Export dependency surfaces (core + extras)
        run: |
          set -euo pipefail
          mkdir -p _scan/core _scan/llm _scan/nemo
          uv export --frozen --no-dev --no-emit-workspace \
            --format requirements-txt > _scan/core/requirements.txt
          uv export --frozen --no-dev --package torch_to_nnef_llm \
            --format requirements-txt > _scan/llm/requirements.txt
          uv export --frozen --no-dev --package torch_to_nnef_nemo_asr \
            --format requirements-txt > _scan/nemo/requirements.txt
      # --ignore-unfixed: only fail on advisories with a fixed version, so the
      # gate is always actionable. Trivy reads .trivyignore from the repo root.
      # Each surface is scanned so all failures surface in one run (no fail-fast).
      - name: CVE gate
        run: |
          set -uo pipefail
          rc=0
          scan() {
            echo "::group::trivy $1 ($2)"
            trivy fs --scanners vuln --severity "$2" --ignore-unfixed \
              --no-progress --exit-code 1 "_scan/$1/requirements.txt" || rc=1
            echo "::endgroup::"
          }
          scan core HIGH,CRITICAL
          scan llm  HIGH,CRITICAL
          scan nemo CRITICAL
          exit $rc
      - name: Generate SPDX SBOM (full locked workspace)
        if: always()
        run: |
          mkdir -p _sbom
          trivy fs --format spdx-json --no-progress \
            --output _sbom/torch-to-nnef.spdx.json ./uv.lock
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: _sbom/torch-to-nnef.spdx.json
          if-no-files-found: error
