name: core CI

on:
  push:
    branches: [main]
    paths:
      - "torch_to_nnef/**"
      - "tests/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-core.yml"
      # Feeds the zoo jobs' prefetch step and keys their model cache, so a
      # change to it has to be able to trigger this workflow.
      - "scripts/hf_pull.py"
  pull_request:
    branches: [main]
    paths:
      - "torch_to_nnef/**"
      - "tests/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-core.yml"
      # Feeds the zoo jobs' prefetch step and keys their model cache, so a
      # change to it has to be able to trigger this workflow.
      - "scripts/hf_pull.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create matrix
        id: create_matrix
        uses: fabiocaccamo/create-matrix-action@842c9dabf1cec0ba7417f30ec26ce2290b951ef0 # v7
        with:
          matrix: |
            python-version {3.10}, tox-env {"torch_1_13"}
            python-version {3.12}, tox-env {"torch_2_2", "zoo_torch_2_2"}
            python-version {3.13}, tox-env {"py313", "zoo_py313", "proptest", "format_check", "static_check", "silero_vad_demo"}
            python-version {3.14}, tox-env {"py314", "zoo_py314"}

    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.prepare.outputs.matrix)}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.23.2

      # The zoo suite downloads torchvision pretrained weights (-> ~/.cache/torch)
      # and albert-base-v2 from Hugging Face (-> ~/.cache/huggingface), and other
      # envs pull torch.hub models (e.g. silero). Reuse them across runs; key on
      # the model-defining test so it busts when the set changes.
      - name: Cache models (torch hub + Hugging Face)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: core-models-${{ hashFiles('tests/test_model_zoo.py', 'scripts/hf_pull.py') }}
          restore-keys: |
            core-models-

      # Warm the HF cache with retries before pytest: the zoo suite pulls
      # albert-base-v2 at collection time, which intermittently hits HF's per-IP
      # 429 on shared runners. Best-effort, so it never fails the build.
      - name: Prefetch HF models for the zoo suite (retry on 429)
        if: contains(matrix.tox-env, 'zoo')
        run: |
          python -m pip install "huggingface_hub>=0.23"
          python scripts/hf_pull.py albert-base-v2

      - name: test with tox
        run: tox run -e ${{ matrix.tox-env }}
