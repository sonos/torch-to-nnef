name: core CI

on:
  push:
    branches: [main]
    paths:
      - "torch_to_nnef/**"
      - "tests/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "torch_to_nnef/**"
      - "tests/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-core.yml"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create matrix
        id: create_matrix
        uses: fabiocaccamo/create-matrix-action@23e3ea74c52412cdb14a34228193b4a1a3cf3b02 # v3
        with:
          matrix: |
            python-version {3.10}, tox-env {"torch_1_13"}
            python-version {3.12}, tox-env {"torch_2_2", "zoo_torch_2_2"}
            python-version {3.13}, tox-env {"py313", "zoo_py313", "proptest", "format_check", "static_check", "silero_vad_demo"}
            python-version {3.14}, tox-env {"py314", "zoo_py314"}

    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.prepare.outputs.matrix)}}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.23.2

      - name: test with tox
        run: tox run -e ${{ matrix.tox-env }}
