[package]
name = "wav-cleaner-pulse"
version = "0.1.0"
edition = "2021"
description = "Read a WAV, run pulsed DPDFNet (NNEF/tract pulse-mode) chunk by chunk, write a clean WAV."
publish = false

# Pinned to sonos/tract main, which now carries the `Fft::axes_mapping`
# natural mapping the streaming-axis-on-Fft path needs (merged via
# PR https://github.com/sonos/tract/pull/2261). Repin to a published
# `tract-*` version once one ships with that change.
[dependencies]
tract-nnef = { git = "https://github.com/sonos/tract.git", rev = "ea8b0a8216d6009a51d10e9e85d8f886634fd3bd" }
tract-pulse = { git = "https://github.com/sonos/tract.git", rev = "ea8b0a8216d6009a51d10e9e85d8f886634fd3bd" }
tract-pulse-opl = { git = "https://github.com/sonos/tract.git", rev = "ea8b0a8216d6009a51d10e9e85d8f886634fd3bd" }
tract-core = { git = "https://github.com/sonos/tract.git", rev = "ea8b0a8216d6009a51d10e9e85d8f886634fd3bd" }
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
