[package]
name = "wav-cleaner-pulse"
version = "0.1.0"
edition = "2021"
description = "Read a WAV, run pulsed DPDFNet (NNEF/tract pulse-mode) chunk by chunk, write a clean WAV."
publish = false

# 0.23.1 includes the pulse sync_inputs Delay-name fix and rejects overflowing
# tensor dimensions when loading NNEF data.
[dependencies]
tract-nnef = "=0.23.1"
tract-pulse = "=0.23.1"
tract-pulse-opl = "=0.23.1"
tract-core = "=0.23.1"
tract-extra = "=0.23.1"
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
