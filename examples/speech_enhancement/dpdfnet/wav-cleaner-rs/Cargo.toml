[package]
name = "wav-cleaner"
version = "0.1.0"
edition = "2021"
description = "Read a WAV, run DPDFNet (NNEF/tract) per frame, write a clean WAV."
publish = false

[dependencies]
tract-nnef = "0.22.1"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
