[package]
name = "mamba"
version = "0.1.0"
edition = "2021"
description = "Streaming inference of Mamba (NNEF/tract) from a HF tokenizer + sidecar manifest."
publish = false

[dependencies]
tract-nnef = "0.22.1"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
