[package]
name = "pocket-tts-tract"
version = "0.1.0"
edition = "2024"
description = "End-to-end Pocket-TTS demo via tract: text + voice prompt -> 24 kHz WAV."

[[bin]]
name = "pocket-tts-tract"
path = "src/main.rs"

[features]
default = []
# Apply ``tract-transformers``' SDPA / RoPE / KV-cache detection rewrites
# before optimization. On tract 0.23.0-dev.5 this is a slight CPU
# pessimisation for our shapes (Sdpa::eval rebuilds + replans per call)
# and a marginal GPU speedup (~1-2%). Kept gated so the codepath is
# ready to flip once tract ships a fast precomputed Sdpa kernel.
# Build with:  cargo build --release --features transformers-detect
transformers-detect = []

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
rand = "0.9"
rand_distr = "0.5"
sentencepiece = "0.11"
tract-core = "0.23.0-dev.5"
tract-extra = "0.23.0-dev.5"
tract-nnef = "0.23.0-dev.5"
tract-pulse = "0.23.0-dev.5"
tract-transformers = "0.23.0-dev.5"

# Metal GPU runtime is macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
tract-metal = "0.23.0-dev.5"

# Point at our local tract checkout so the CLI picks up the in-flight
# pulse fixes (PRs #2201 + #2202 + the deconv runtime work). Once those
# land in a published tract release, drop the [patch] block.
[patch.crates-io]
tract-core = { path = "/Users/julien.balian/SONOS/src/tract/core" }
tract-data = { path = "/Users/julien.balian/SONOS/src/tract/data" }
tract-extra = { path = "/Users/julien.balian/SONOS/src/tract/extra" }
tract-linalg = { path = "/Users/julien.balian/SONOS/src/tract/linalg" }
tract-nnef = { path = "/Users/julien.balian/SONOS/src/tract/nnef" }
tract-pulse = { path = "/Users/julien.balian/SONOS/src/tract/pulse" }
tract-gpu = { path = "/Users/julien.balian/SONOS/src/tract/gpu" }
tract-pulse-opl = { path = "/Users/julien.balian/SONOS/src/tract/pulse-opl" }
tract-transformers = { path = "/Users/julien.balian/SONOS/src/tract/transformers" }
tract-metal = { path = "/Users/julien.balian/SONOS/src/tract/metal" }
