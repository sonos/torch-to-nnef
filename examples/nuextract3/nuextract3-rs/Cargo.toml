[package]
name = "nuextract3"
version = "0.1.0"
edition = "2021"
description = "Single-binary tract demo of NuExtract3 image-to-Markdown generation."
publish = false

[dependencies]
# Pinned to match the mamba examples: the last tract main rev before the
# f32 AMX dispatch regression on M=1, large-N matmuls (the LM head). See
# examples/mamba/pulse/mamba-rs/Cargo.toml for the full story.
tract-nnef = { git = "https://github.com/sonos/tract", rev = "0c771a4c7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
