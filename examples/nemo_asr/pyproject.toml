[project]
name = "t2n-example-nemo-asr"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "torch_to_nnef[nemo-tract]",
    # TorchAudio 2.11 supports later PyTorch releases.
    "torch==2.13.0",
    "torchaudio==2.11.*",
]

[tool.uv]
package = false
# NeMo caps Hydra below its security fix, and its lightning<=2.4.0 pin caps
# fsspec<2026 (below its fix); override both. lightning itself stays at
# 2.4.0: >=2.6 breaks nv-one-logger's Trainer subclass that NeMo imports.
override-dependencies = ["hydra-core==1.3.7", "fsspec[http]>=2026.6.0"]
# Keep pytorch-lightning patched while respecting upstream requirements.
constraint-dependencies = ["pytorch-lightning>=2.6.6"]

[tool.uv.sources]
torch_to_nnef = { path = "../../", editable = true }
