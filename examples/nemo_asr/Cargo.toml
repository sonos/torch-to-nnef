[workspace]
resolver = "3"

members = ["./src/nemo_asr/", "./src/nemo_asr_ffi", "src/nemo_asr_ffi"]

[workspace.dependencies]
anyhow = "1.0"
env_logger = "0.11"
itertools = "0.15"
log = "0.4"
libc = "0.2"
ffi-convert = "0.8"
hound = "3.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
test-log = "0.2.21"
tract-rs = { package = "tract", version = "=0.23.9", default-features = false, features = ["flate2", "transformers", "metal", "cuda-13000"] }
ndarray = "0.17"
ndarray-npy = { version = "0.10", default-features = false }

[profile.release]
debug = true

[patch.crates-io]
# Upstream ZIP 9 support; remove once ndarray-npy publishes this fix.
# https://github.com/jturner314/ndarray-npy/pull/109
ndarray-npy = { git = "https://github.com/jturner314/ndarray-npy", rev = "0215776b072b80b5d5bfe11455f4e8584f14501e" }
