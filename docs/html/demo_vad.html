<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
        <script src="./uPlot.iife.min.js"></script>
        <link rel="stylesheet" href="./uPlot.min.css">
        <link rel="stylesheet" href="./theme.css">
        <script src="./sync_receiver_colorscheme.js"></script>
        <style>
        .page    { display: none; padding: 0 0.5em; }
        .page h1 { font-size: 2em; line-height: 1em; margin-top: 1.1em; font-weight: bold; }
        .page p  { font-size: 1.5em; line-height: 1.275em; margin-top: 0.15em; }

        #loading {
            display: flex;
            position: fixed;
            z-index: 100;
            width: 100%;
            height: 100%;
            background-color: "#aaa";
        }

        .centered {
            position: fixed;
            top: 50%;
            left: 50%;
            text-align: center;
            transform: translate(-50%, -50%);
            transform: -webkit-translate(-50%, -50%);
            transform: -moz-translate(-50%, -50%);
            transform: -ms-translate(-50%, -50%);
        }

        #vad-preview .u-hz {
            padding-top: 10px;
            padding-bottom: 10px;
        }
        </style>
        <script type="module">
import init, { VadClassifier } from './vad_wasm.js';

let vad_classifier = null;

const desiredSampleRate = 16000;
const bufferSize = 512; // must be a power of 2
let length = 256; // plotted points; older predictions will be shifted out

let realSampleRate = null; // AudioContext.sampleRate
let plotMsStep = 0; // ms per plotted point (throttled)
let hz = 0; // plot refresh rate in Hz
let timesElapsedArr = null; // recomputed once audio starts
let data = null; // will be initialized once audio starts

let currentTimeValue = 0;
let vadScores = Array.from({length}, () => 0);
let vadDet = Array.from({length}, () => 0);
let threshold = 0.95;
let postProcWindowSize = 10; // recomputed once audio starts from plot cadence
const getData = (time_offset, score) => {
    const start = Math.max(0, vadScores.length - postProcWindowSize);
    const maxDet = Math.max(...vadScores.slice(start)) > threshold ? 1.0 : 0.0;
    const isDet = vadDet[vadDet.length - 1] === 1 ? maxDet : (score > threshold ? 1.0 : 0.0);
    return [
        (timesElapsedArr = timesElapsedArr.slice(1).concat(time_offset)),
        (vadScores = vadScores.slice(1).concat(score)),
        (vadDet = vadDet.slice(1).concat(isDet)),
    ];
};
const vad_preview_dom = document.getElementById('vad-preview');
const getSize = () => {
    return {
        width: vad_preview_dom.clientWidth - 50,
        height: 150,
    }
}
let sizes = getSize();
// Optional "now" marker synced to audioMs
const params = new URLSearchParams(location.search);
const showNow = params.get('now') !== '0';
let nowMarker = {
    hooks: {
        draw: (u) => {
            if (!showNow) return;
            const x = u.valToPos(currentTimeValue, 'x', true);
            const { ctx, bbox } = u;
            ctx.save();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, bbox.top);
            ctx.lineTo(x, bbox.top + bbox.height);
            ctx.stroke();
            ctx.restore();
        }
    }
};

let opts = {
    title: `VAD detection with Nvidia MarbleNet @ ${hz}hz:`,
    width: sizes.width,
    height: sizes.height,
    pxAlign: false,
    scales: {
        x: {
            time:false,
        },
        y: {
            //	auto: false,
            range: [0, 1.1],
        }
    },
    axes: [
        {
            space: 50,
            values: (self, val) => {
                return val.map((v) => (
                    `${v/ 1000}s`
                ));
            },
        }
    ],
    series: [
        {
        },
        {
            label: "detection score",
            stroke: "blue",
            fill: "#0000ff20",
        },
        {
            label: `detection (binary)` ,
            stroke: "red",
            fill: "#ff00ff10",
        },
    ],
    plugins: [nowMarker],
};
let inited = false;
init().then(() => {
    console.log("start wasm");
    vad_classifier = VadClassifier.load();
    console.log("inited wasm");
    inited = true;
    setVisible('page', true);
    setVisible('loading', false);
})
// ---- Linear resampler to 16 kHz (LPF optional) ----
const sinc = (x) => (x === 0 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x));
const designLowpassFIR = (cutoffHz, sampleRate, taps) => {
    const fc = cutoffHz / (sampleRate / 2); // normalized 0..1 (Nyquist=1)
    const M = taps - 1;
    const h = new Float32Array(taps);
    for (let n = 0; n < taps; n++) {
        const k = n - M / 2;
        const ideal = 2 * fc * sinc(2 * fc * k);
        const w = 0.54 - 0.46 * Math.cos((2 * Math.PI * n) / M); // Hamming window
        h[n] = ideal * w;
    }
    // Normalize to unity gain at DC
    const sum = h.reduce((a, b) => a + b, 0);
    for (let n = 0; n < taps; n++) h[n] /= sum || 1;
    return h;
};

const makeResampler = (inRate, outRate, withLPF = true) => {
    const taps = withLPF ? 64 : 0;
    // Keep a bit of margin under 8 kHz to reduce aliasing at edges
    const cutoff = withLPF ? Math.min(7900, 0.45 * outRate) : 0;
    const h = withLPF ? designLowpassFIR(cutoff, inRate, taps) : null;
    return {
        inRate,
        outRate,
        h,
        taps,
        withLPF,
        hist: withLPF ? new Float32Array(taps) : null, // FIR history (MRU at 0)
        pos: 0, // fractional read position for linear interpolation
        prev: 0, // last filtered sample from previous block
        ratio: inRate / outRate,
        // Process one input block
        process(block) {
            let y;
            if (this.withLPF) {
                // FIR filtering (direct form, small taps → ok in JS)
                y = new Float32Array(block.length);
                for (let n = 0; n < block.length; n++) {
                    // shift history right by 1, insert new sample at 0
                    for (let k = this.taps - 1; k > 0; k--) this.hist[k] = this.hist[k - 1];
                    this.hist[0] = block[n];
                    let acc = 0;
                    for (let k = 0; k < this.taps; k++) acc += this.h[k] * this.hist[k];
                    y[n] = acc;
                }
            } else {
                // No LPF: pass-through the input block directly
                y = block;
            }
            // Linear resampling to outRate with stateful phase
            // Prepend last filtered sample from previous block to ensure continuity for i+1
            const proc = new Float32Array(y.length + 1);
            proc[0] = this.prev;
            proc.set(y, 1);
            const out = [];
            while (this.pos <= proc.length - 2) {
                const i = Math.floor(this.pos);
                const frac = this.pos - i;
                const s0 = proc[i];
                const s1 = proc[i + 1];
                out.push(s0 + (s1 - s0) * frac);
                this.pos += this.ratio;
            }
            // carry state to next block
            this.pos -= (proc.length - 1);
            this.prev = proc[proc.length - 1];
            return new Float32Array(out);
        },
    };
};

let resampler = null;
document.getElementById('vad-click').addEventListener('click', (e) => {
    console.log("try start VAD demo");
    if (inited) {
        console.log("start VAD demo");
        let audioContext;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            // Request 16 kHz context when supported; browsers may ignore
            audioContext = new AC({ sampleRate: desiredSampleRate });
        } catch (e) {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioContext = new AC();
        }
        // Timing from audio clock; throttle plot to target FPS
        realSampleRate = audioContext.sampleRate;
        const PLOT_FPS = parseInt((params.get('fps') || '60'), 10);
        plotMsStep = 1000 / PLOT_FPS;
        hz = PLOT_FPS;
        const smoothMs = parseInt((params.get('smooth') || '200'), 10); // ms
        postProcWindowSize = Math.max(1, Math.round(smoothMs / plotMsStep));
        timesElapsedArr = Array.from({length}, (v, i) => i * plotMsStep - (length * plotMsStep));
        data = getData(currentTimeValue);
        opts = { ...opts, title: `VAD detection with Nvidia MarbleNet @ ${hz}hz:` };
        console.log("request microphone access");
        navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    sampleRate: desiredSampleRate,
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false,
                    // Browser-specific toggles (ignored if unsupported)
                    googEchoCancellation: false,
                    googAutoGainControl: false,
                    googNoiseSuppression: false,
                }
            })
            .then(stream => {
                document.getElementById('vad-prestart').remove();
                let u = new uPlot(opts, data, vad_preview_dom);
                window.addEventListener("resize", e => {
                    u.setSize(getSize());
                });
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(bufferSize, 1, 1);
                source.connect(processor);
                // No need to monitor to speakers for VAD; keep graph-only
                // processor.connect(audioContext.destination);
                // Reactivate LPF for resampler
                resampler = makeResampler(audioContext.sampleRate, desiredSampleRate, true);
                // Use an AudioWorklet for tighter scheduling; fall back to ScriptProcessor if failed
                const startWithWorklet = async () => {
                    try {
                        await audioContext.audioWorklet.addModule('./vad_worklet.js');
                        const workletNode = new AudioWorkletNode(audioContext, 'vad-processor');
                        source.connect(workletNode);
                        // Timeline from processed sample count for accuracy
                        let audioMs = 0;
                        let nextPlotMs = 0;
                        let lastScore = 0.0;
                        let pendingRAF = false;
                        workletNode.port.onmessage = (ev) => {
                            const msg = ev.data || {};
                            if (msg.type === 'audio' && msg.buffer) {
                                const mergedData = new Float32Array(msg.buffer);
                                const resampledData =
                                    audioContext.sampleRate === desiredSampleRate
                                        ? mergedData
                                        : resampler.process(mergedData);
                                if (resampledData && resampledData.length) {
                                    lastScore = vad_classifier.predict_speech_presence(resampledData);
                                    // advance by original frames (pre-resample) for stable time
                                    audioMs += (mergedData.length / realSampleRate) * 1000;
                                    while (audioMs >= nextPlotMs) {
                                        currentTimeValue = nextPlotMs;
                                        data = getData(currentTimeValue, lastScore);
                                        nextPlotMs += plotMsStep;
                                    }
                                    if (!pendingRAF) {
                                        pendingRAF = true;
                                        requestAnimationFrame(() => {
                                            u.setData(data);
                                            pendingRAF = false;
                                        });
                                    }
                                }
                            }
                        };
                    } catch (e) {
                        console.warn('AudioWorklet unavailable, falling back:', e);
                        const processor = audioContext.createScriptProcessor(bufferSize, 1, 1);
                        source.connect(processor);
                        let audioMs = 0;
                        let nextPlotMs = 0;
                        let lastScore = 0.0;
                        let pendingRAF = false;
                        processor.onaudioprocess = (ev) => {
                            const inputBuffer = ev.inputBuffer;
                            const numChannels = inputBuffer.numberOfChannels;
                            let mergedData = new Float32Array(inputBuffer.length);
                            for (let ch = 0; ch < numChannels; ch++) {
                                const inputData = inputBuffer.getChannelData(ch);
                                for (let i = 0; i < inputData.length; i++) {
                                    mergedData[i] += inputData[i] / numChannels;
                                }
                            }
                            const resampledData =
                                audioContext.sampleRate === desiredSampleRate
                                    ? mergedData
                                    : resampler.process(mergedData);
                            if (resampledData && resampledData.length) {
                                lastScore = vad_classifier.predict_speech_presence(resampledData);
                                audioMs += (inputBuffer.length / realSampleRate) * 1000;
                                while (audioMs >= nextPlotMs) {
                                    currentTimeValue = nextPlotMs;
                                    data = getData(currentTimeValue, lastScore);
                                    nextPlotMs += plotMsStep;
                                }
                                if (!pendingRAF) {
                                    pendingRAF = true;
                                    requestAnimationFrame(() => {
                                        u.setData(data);
                                        pendingRAF = false;
                                    });
                                }
                            }
                        };
                    }
                };
                startWithWorklet();
            })
            .catch((data) => {
                console.error(data);
                setVisible('error-container', true);
                let msg = (
                    data +
                    " If you are on mobile ensure that your browser app " +
                    "have access to microphone: " +
                    "<a target='_blank' rel='noopener noreferrer' href='https://support.proof.com/hc/en-us/articles/14237306788503-Enable-camera-and-microphone-for-mobile'>documentation</a>"
                );
                document.getElementById("error").innerHTML = msg;
            });
    }
});

const setVisible = (idName, visible) => {
  let elm = document.getElementById(idName);
  elm.style.display = visible ? 'block' : 'none';
};

setVisible('error-container', false);
setVisible('page', false);
setVisible('loading', true);
// Trigger on load and whenever content changes {
const sendHeight = () => {
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ type: 'resize', height, ref: 'vad' }, '*');
};
window.addEventListener('load', sendHeight);
new ResizeObserver(sendHeight).observe(document.body);
//}
</script>
    </head>
    <body>
        <div class="container" id="page">
            <div id="vad-preview" class="card">
                <div id="vad-prestart">
                    <div class="card-content" style="justify-content: 'center'">
                        <span class="card-title">👀 <span style="color:#6666aa">Live Demo: </span> Voice Activity Detection</span>
                        <p>You need a microphone on your device and a browser that support WASM.</p>
                        <div id="error-container" class="card-panel red lighten-4">
                            <span id="error"></span>
                        </div>
                    </div>
                    <div class="card-action">
                        <button id="vad-click" class="btn btn-large blue darken-3 waves-effect waves-light">
                            [ ▸ ] Start VAD stream
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div id="loading">
            <div class="centered">
                <div class="progress">
                    <div class="indeterminate"></div>
                </div>
                <h4>
                    <span class="card-title">👀 <span style="color:teal">Live Demo: </span> Voice Activity Detection</span>
                </h4>
                <h5 id="loadstatus">
                    downloading model
                </h5>
            </div>
        </div>
    </body>
</html>
