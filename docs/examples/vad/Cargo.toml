[package]
name = "vad-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
tract-rs = { package = "tract", git = "https://github.com/sonos/tract.git", rev = "f74446b6", default-features = false }
# Activate the wasm rng backend on all getrandom versions that tract pulls
# transitively (0.3 via rand 0.9 / half, 0.4 via rand 0.10 / rand_distr).
# Without these, the wasm32 build fails with `backends::inner_u64 not found`
# because the crate cannot pick a backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
ndarray = "0.17"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
anyhow = "1.0"
console_error_panic_hook = "0.1"

[features]
default = []
log-vad = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
hound = "3.5"
lewton = "0.10" # optional; reserved for future ogg/vorbis if needed
