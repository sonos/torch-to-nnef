[workspace]
resolver = "3"

members = ["./src/nemo_asr/", "./src/nemo_asr_ffi", "src/nemo_asr_ffi"]

[workspace.dependencies]
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
libc = "0.2"
ffi-convert = "0.6"
hound = "3.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tract-core = { git = "https://github.com/sonos/tract.git", rev = "f266c8a" }
tract-nnef = { git = "https://github.com/sonos/tract.git", rev = "f266c8a" }

[profile.release]
debug = true
