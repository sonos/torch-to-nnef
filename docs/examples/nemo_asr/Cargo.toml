[package]
name = "nemo_asr"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
tract-nnef = { git = "https://github.com/sonos/tract.git", rev = "f266c8a" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["console"] }

base64 = "0.22.1"
anyhow = "1.0"
lazy_static = "1.5.0"

# [dev-dependencies]
hound = "3.5.1"
