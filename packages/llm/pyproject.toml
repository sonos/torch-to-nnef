[project]
name = "torch_to_nnef_llm"
version = "0.24.6"
description = "LLM and PEFT export to NNEF via torch-to-nnef."
authors = [{ name = "Julien Balian", email = "julien.balian@sonos.com" }]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
readme = { text = "LLM and PEFT export to NNEF. See [torch-to-nnef](https://github.com/sonos/torch-to-nnef) for details.", content-type = "text/markdown" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["nnef", "pytorch", "torch", "llm", "transformers", "peft", "export"]
dependencies = [
    "torch_to_nnef>=0.22.0",
    "huggingface-hub>0.24",
    "protobuf>5",
    "sentencepiece>=0.2.0,<0.3",
    "tokenizers>=0.13.3",
    "transformers>=4.35.2,<6",
]

[project.optional-dependencies]
accelerate = ["accelerate"]
peft = ["peft"]
safetensors = ["safetensors"]

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<8",
    "ruff<1.0",
    "peft",
    "coverage[toml]",
]

[project.scripts]
t2n_export_llm_to_tract = "torch_to_nnef_llm.cli:main"
t2n_export_multimodal_to_tract = "torch_to_nnef_llm.cli:main_multimodal"
t2n_export_peft_to_nnef = "torch_to_nnef_llm.peft.cli:main"

[project.urls]
Homepage = "https://github.com/sonos/torch-to-nnef"

[tool.uv.sources]
torch_to_nnef = { workspace = true }

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["torch_to_nnef_llm"]

[tool.hatch.build.targets.wheel]
include = ["torch_to_nnef_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:warnings -s"
markers = [
    "ci_skip: marks tests as slow (deselect with '-m \"not ci_skip\"')",
    "serial",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "G", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["torch_to_nnef", "torch_to_nnef_llm", "torch_to_nnef_nemo"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tox]
isolated_build = true
envlist = ["cli_transformers_5_5_0"]
requires = ["tox>=4", "virtualenv>20.2", "tox-uv>1.27.0"]

[tool.tox.env_run_base]
dependency_groups = ["test"]
passenv = ["*"]
constrain_package_deps = true

[[tool.tox.env_run_base.setenv]]
PYTHONPATH = "{toxinidir}/../.."
PYTHONWARNINGS = "ignore"
MODELS = "1"

[tool.tox.env.cli_transformers_4_50_0]
basepython = ["python3.12", "python3.13"]
dependency_groups = ["test"]
constrain_package_deps = false
deps = ["transformers==4.50.0"]
commands = [["pytest", "-s", "tests/test_llm_cli.py", "tests/test_load_retry.py", "tests/test_upcast_quant.py", "tests/test_sdpa_attention_export.py"]]

[tool.tox.env.cli_transformers_4_52_0]
basepython = ["python3.12", "python3.13"]
dependency_groups = ["test"]
constrain_package_deps = false
deps = ["transformers==4.52.0"]
commands = [["pytest", "-s", "tests/test_llm_cli.py", "tests/test_load_retry.py", "tests/test_upcast_quant.py", "tests/test_sdpa_attention_export.py"]]

[tool.tox.env.cli_transformers_5_0_0]
basepython = ["python3.12", "python3.13"]
dependency_groups = ["test"]
constrain_package_deps = false
deps = ["transformers==5.0.0"]
commands = [["pytest", "-s", "tests/test_llm_cli.py", "tests/test_load_retry.py", "tests/test_upcast_quant.py", "tests/test_sdpa_attention_export.py"]]

[tool.tox.env.cli_transformers_5_5_0]
basepython = ["python3.12", "python3.13"]
dependency_groups = ["test"]
constrain_package_deps = false
deps = ["transformers==5.5.0"]
commands = [["pytest", "-s", "tests/test_llm_cli.py", "tests/test_load_retry.py", "tests/test_upcast_quant.py", "tests/test_sdpa_attention_export.py"]]
