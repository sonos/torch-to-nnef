strictness: high
doc-warnings: false
test-warnings: false

pylint:
  disable:
    - missing-docstring
    - ungrouped-imports
    - bad-mcs-classmethod-argument
    - django-not-available # we don't use Django

pycodestyle:
  disable:
    - E203 # conflict with ruff

mccabe:
  options:
    max-complexity: 15

ignore-paths:
  - .git
  - .venv
  - venv
  - .tox
  - .nox
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .cache
  # Build & dist artifacts
  - build
  - dist
  - .eggs
  - htmlcov
  - coverage_html
  # rust examples
  - target
  # Generated Python cruft
  - __pycache__
  - "*.pyc"
  # Docs output
  - docs/_build
  - site
  # Vendored from huggingface/open_asr_leaderboard's normalizer (whisper-style
  # text normalizer + abbreviations). Kept verbatim to allow upstream syncs;
  # see ``examples/nemo_asr/src/nemo_asr_py/nemo_asr_tract/normalizer/__init__.py``
  # for the upstream commit reference.
  - examples/nemo_asr/src/nemo_asr_py/nemo_asr_tract/normalizer
  # Per-example virtualenvs / rust target/ dirs / HF caches that exist locally
  # after a contributor runs ``examples/<x>/run.sh``. CI never has these so it
  # finishes in ~90 s; locally they balloon scan time to >30 min if scanned.
  # ``ignore-paths`` matches as a path prefix (not a glob) so each nested copy
  # has to be listed explicitly.
  - examples/image_gen/.venv
  - examples/vad/.venv
  - examples/vad/py/.venv
  - examples/vad/py/hf_cache
  - examples/vad/hf_cache
  - examples/vad/target
  - examples/yolo/target
  - examples/imageclass-wasm/target
  - examples/llm_wasm/target
  - examples/getting_started_rs/target
  - examples/nemo_asr/target
